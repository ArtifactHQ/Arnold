---
# Universal abstract concerns for brownfield codebase analysis.
# These are stack-agnostic; framework_overlays.yml provides stack-specific mappings.

concerns:
  auth:
    name: Authentication & Authorization
    description: User identity, login, sessions, roles, permissions, and access control.
    indicators:
      - authentication
      - authorization
      - login
      - session
      - password
      - token
      - oauth
      - jwt
      - role
      - permission
      - devise
      - auth

  data_layer:
    name: Data Layer
    description: Database schema, ORM models, migrations, relationships, and data access patterns.
    indicators:
      - model
      - migration
      - schema
      - database
      - orm
      - active_record
      - prisma
      - entity
      - repository
      - query

  api_layer:
    name: API Layer
    description: HTTP endpoints, REST/GraphQL APIs, serialization, and external API integrations.
    indicators:
      - controller
      - route
      - endpoint
      - api
      - graphql
      - rest
      - serializer
      - middleware
      - request
      - response

  background_jobs:
    name: Background Jobs
    description: Asynchronous task processing, job queues, scheduled tasks, and workers.
    indicators:
      - job
      - worker
      - queue
      - async
      - sidekiq
      - solid_queue
      - celery
      - cron
      - scheduled
      - background

  realtime:
    name: Real-Time Features
    description: WebSockets, server-sent events, push notifications, and live updates.
    indicators:
      - websocket
      - channel
      - cable
      - broadcast
      - notification
      - push
      - stream
      - live
      - sse
      - pubsub

  testing:
    name: Testing
    description: Test suite, test frameworks, fixtures, factories, and test infrastructure.
    indicators:
      - test
      - spec
      - fixture
      - factory
      - mock
      - stub
      - coverage
      - minitest
      - rspec
      - jest
      - pytest

  frontend:
    name: Frontend & UI
    description: User interface components, pages, layouts, client-side state, styling, and user interactions.
    indicators:
      - component
      - page
      - layout
      - hook
      - useState
      - useEffect
      - context
      - provider
      - modal
      - form
      - button
      - sidebar
      - navbar
      - dashboard
      - view
      - template
      - partial
      - stylesheet
      - tailwind
      - css
      - styled
      - theme
      - responsive
      - ui

  navigation:
    name: Navigation & Routing
    description: Screen navigation, deep linking, tab/stack/drawer routing in mobile and SPA apps.
    indicators:
      - screen
      - stack
      - navigator
      - tab
      - deeplink
      - drawer
      - navigate
      - route
      - navigation
      - linking

  state_management:
    name: State Management
    description: Client-side state stores, reducers, actions, selectors, and state persistence.
    indicators:
      - redux
      - saga
      - thunk
      - slice
      - reducer
      - dispatch
      - store
      - zustand
      - context
      - provider
      - selector
      - state

  native_platform:
    name: Native Platform
    description: Platform-specific code, native modules, permissions, and device capabilities.
    indicators:
      - ios
      - android
      - native_module
      - bridge
      - permission
      - camera
      - biometric
      - keychain
      - platform
      - turbo_module

  push_notifications:
    name: Push Notifications
    description: Push notification registration, handling, and display.
    indicators:
      - firebase
      - fcm
      - apns
      - notification
      - messaging
      - push_token
      - badge
      - remote_notification

  localization:
    name: Localization & Internationalization
    description: Multi-language support, translation files, locale management, and i18n framework configuration.
    indicators:
      - locale
      - i18n
      - l10n
      - translation
      - intl
      - localize
      - language
      - strings
      - messages
      - react-i18next
      - formatjs
      - Localizable

  analytics:
    name: Analytics & Tracking
    description: User behavior tracking, event logging, product analytics, and engagement metrics.
    indicators:
      - analytics
      - tracking
      - mixpanel
      - amplitude
      - segment
      - firebase_analytics
      - posthog
      - event
      - track
      - logEvent
      - gtag
      - plausible

  feature_flags:
    name: Feature Flags & Remote Config
    description: Feature toggles, remote configuration, A/B testing, and gradual rollouts.
    indicators:
      - feature_flag
      - feature_toggle
      - launchdarkly
      - flagsmith
      - unleash
      - remote_config
      - experiment
      - ab_test
      - variant
      - rollout

  deep_linking:
    name: Deep Linking & URL Schemes
    description: Universal links, app links, deep link routing, and URL scheme handling.
    indicators:
      - deeplink
      - deep_link
      - universal_link
      - app_link
      - url_scheme
      - linking
      - branch
      - dynamic_link

  deployment:
    name: Deployment & Infrastructure
    description: CI/CD pipelines, containerization, hosting, and infrastructure configuration.
    indicators:
      - docker
      - dockerfile
      - kubernetes
      - ci
      - cd
      - deploy
      - kamal
      - heroku
      - aws
      - terraform
      - github_actions
