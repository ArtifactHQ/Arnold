---
# Per-stack concern overlays with typical implementations, expected locations, and conventions.

stacks:
  ruby_rails:
    auth:
      typical_implementations:
        - Rails 8 built-in authentication (has_secure_password)
        - Devise gem
        - Rodauth
        - Custom session-based auth
      expected_locations:
        - app/models/user.rb
        - app/controllers/sessions_controller.rb
        - app/controllers/registrations_controller.rb
        - app/controllers/passwords_controller.rb
        - app/controllers/concerns/authentication.rb
        - config/initializers/devise.rb
      behavioral_files:
        - app/models/user.rb
        - app/models/session.rb
        - app/models/current.rb
        - app/controllers/concerns/authentication.rb
        - app/controllers/sessions_controller.rb
        - app/controllers/registrations_controller.rb
        - app/controllers/passwords_controller.rb
      conventions:
        session_store: cookie-based (Rails default)
        password_hashing: bcrypt via has_secure_password
        current_user: Current.user via ActiveSupport::CurrentAttributes

    data_layer:
      typical_implementations:
        - ActiveRecord (Rails default ORM)
        - SQLite / PostgreSQL / MySQL
      expected_locations:
        - app/models/
        - db/migrate/
        - db/schema.rb
        - db/seeds.rb
        - app/models/concerns/
      behavioral_files:
        - "app/models/*.rb"
        - "app/models/concerns/*.rb"
        - "app/services/*.rb"
      conventions:
        naming: "singular model name, plural table name"
        associations: "has_many, belongs_to, has_one, has_and_belongs_to_many"
        validations: "ActiveModel validations in model files"
        callbacks: "before_save, after_create, etc."

    api_layer:
      typical_implementations:
        - RESTful resource routes
        - Turbo Streams for real-time
        - API-only mode (--api flag)
        - GraphQL via graphql-ruby
      expected_locations:
        - config/routes.rb
        - app/controllers/
        - app/controllers/api/
        - app/views/
      behavioral_files:
        - "app/controllers/**/*.rb"
        - "app/serializers/*.rb"
        - "app/policies/*.rb"
      conventions:
        routing: "resources :models with standard CRUD actions"
        response_formats: "HTML, Turbo Stream, JSON"
        strong_params: "params.require(:model).permit(...)"

    background_jobs:
      typical_implementations:
        - Solid Queue (Rails 8 default)
        - Sidekiq
        - Delayed Job
        - Good Job
      expected_locations:
        - app/jobs/
        - config/recurring.yml
        - app/mailers/
      behavioral_files:
        - "app/jobs/*.rb"
        - "app/mailers/*.rb"
      conventions:
        interface: "ActiveJob with perform_later / perform_now"
        queue_adapter: "config.active_job.queue_adapter"

    realtime:
      typical_implementations:
        - Action Cable with Solid Cable
        - Turbo Streams broadcasts
        - Hotwire
      expected_locations:
        - app/channels/
        - app/javascript/channels/
        - config/cable.yml
      behavioral_files:
        - "app/channels/*.rb"
        - "app/javascript/channels/*.js"
      conventions:
        broadcasting: "model.broadcast_append_to / broadcast_replace_to"
        channels: "ApplicationCable::Channel subclasses"

    testing:
      typical_implementations:
        - Minitest (Rails default)
        - RSpec
        - Capybara for system tests
      expected_locations:
        - test/
        - spec/
        - test/models/
        - test/controllers/
        - test/system/
        - test/fixtures/
      behavioral_files:
        - "test/**/*_test.rb"
        - "spec/**/*_spec.rb"
      conventions:
        runner: "bin/rails test or bundle exec rspec"
        fixtures: "test/fixtures/*.yml"
        system_tests: "driven_by :selenium, using: :headless_chrome"

    frontend:
      typical_implementations:
        - ERB views with layouts
        - Hotwire (Turbo + Stimulus)
        - ViewComponent
        - Importmap or jsbundling-rails
        - Tailwind CSS via tailwindcss-rails
      expected_locations:
        - app/views/
        - app/views/layouts/
        - app/helpers/
        - app/javascript/
        - app/javascript/controllers/
        - app/components/
        - app/assets/stylesheets/
      behavioral_files:
        - "app/views/**/*.html.erb"
        - "app/helpers/*.rb"
        - "app/javascript/controllers/*.js"
        - "app/components/**/*.rb"
      conventions:
        templating: "ERB partials with _prefix naming"
        interactivity: "Stimulus controllers for JS behavior"
        navigation: "Turbo Drive for SPA-like page transitions"
        updates: "Turbo Frames and Turbo Streams for partial updates"

    deployment:
      typical_implementations:
        - Kamal 2 (Rails 8 default)
        - Heroku
        - Docker + custom
        - Capistrano
      expected_locations:
        - config/deploy.yml
        - Dockerfile
        - .github/workflows/
        - Procfile
      behavioral_files:
        - config/deploy.yml
        - Dockerfile
        - ".github/workflows/*.yml"
      conventions:
        assets: "rails assets:precompile"
        secrets: "Rails encrypted credentials"

  typescript_nextjs:
    auth:
      typical_implementations:
        - NextAuth.js / Auth.js
        - Clerk
        - Custom JWT
        - Supabase Auth
      expected_locations:
        - app/api/auth/[...nextauth]/route.ts
        - lib/auth.ts
        - middleware.ts
      behavioral_files:
        - lib/auth.ts
        - middleware.ts
        - "app/api/auth/**/route.ts"
      conventions:
        session_store: JWT or database sessions
        middleware: "Next.js middleware for route protection"

    data_layer:
      typical_implementations:
        - Prisma ORM
        - Drizzle ORM
        - TypeORM
        - Raw SQL
      expected_locations:
        - prisma/schema.prisma
        - lib/db.ts
        - app/api/**/route.ts
      behavioral_files:
        - "lib/db*.ts"
        - "lib/models/*.ts"
        - "lib/services/*.ts"
        - prisma/schema.prisma
      conventions:
        schema: "Prisma schema or Drizzle schema files"
        migrations: "prisma migrate or drizzle-kit"

    api_layer:
      typical_implementations:
        - Next.js API Routes (app/api/)
        - Next.js Server Actions
        - tRPC
        - REST endpoints
      expected_locations:
        - app/api/**/route.ts
        - app/**/actions.ts
        - lib/api/
      behavioral_files:
        - "app/api/**/route.ts"
        - "app/**/actions.ts"
        - "lib/api/*.ts"
      conventions:
        routing: "file-based routing in app/ directory"
        data_fetching: "Server Components, fetch(), Server Actions"

    background_jobs:
      typical_implementations:
        - Vercel Cron
        - Inngest
        - BullMQ
        - Custom with node-cron
      expected_locations:
        - app/api/cron/
        - vercel.json (crons section)
        - lib/jobs/
      behavioral_files:
        - "app/api/cron/**/route.ts"
        - "lib/jobs/*.ts"
      conventions:
        scheduling: "API route-based cron triggers"

    realtime:
      typical_implementations:
        - Pusher
        - Ably
        - Socket.io
        - Server-Sent Events
      expected_locations:
        - lib/pusher.ts
        - app/api/socket/
      behavioral_files:
        - "lib/pusher*.ts"
        - "app/api/socket/**/route.ts"
        - "lib/realtime/*.ts"
      conventions:
        pattern: "Event-driven pub/sub"

    testing:
      typical_implementations:
        - Jest
        - Vitest
        - Playwright
        - Cypress
      expected_locations:
        - __tests__/
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - cypress/
        - e2e/
      behavioral_files:
        - "__tests__/**/*.test.ts"
        - "**/*.test.ts"
        - "**/*.spec.ts"
      conventions:
        runner: "npm test or npx jest"
        e2e: "Playwright or Cypress"

    frontend:
      typical_implementations:
        - React Server Components + Client Components
        - Next.js App Router (layouts, pages, loading, error boundaries)
        - Tailwind CSS / CSS Modules / styled-components
        - Shadcn/ui / Radix / Headless UI
      expected_locations:
        - app/**/page.tsx
        - app/**/layout.tsx
        - app/components/
        - components/
        - lib/hooks/
        - app/**/loading.tsx
        - app/**/error.tsx
      behavioral_files:
        - "app/**/page.tsx"
        - "app/**/layout.tsx"
        - "components/**/*.tsx"
        - "lib/hooks/*.ts"
      conventions:
        routing: "file-based routing via app/ directory structure"
        components: "React function components with TypeScript"
        state: "useState, useContext, Zustand, or Jotai for client state"

    deployment:
      typical_implementations:
        - Vercel (default for Next.js)
        - Docker
        - AWS Amplify
        - Netlify
      expected_locations:
        - vercel.json
        - next.config.js (output setting)
        - Dockerfile
        - .github/workflows/
      behavioral_files:
        - vercel.json
        - next.config.js
        - Dockerfile
        - ".github/workflows/*.yml"
      conventions:
        build: "next build"
        output: "standalone, export, or default"

