    realtime:
      typical_implementations:
        - Pusher
        - Ably
        - Socket.io
        - Server-Sent Events
      expected_locations:
        - lib/pusher.ts
        - app/api/socket/
      behavioral_files:
        - "lib/pusher*.ts"
        - "app/api/socket/**/route.ts"
        - "lib/realtime/*.ts"
      conventions:
        pattern: "Event-driven pub/sub"

    testing:
      typical_implementations:
        - Jest
        - Vitest
        - Playwright
        - Cypress
      expected_locations:
        - __tests__/
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - cypress/
        - e2e/
      behavioral_files:
        - "__tests__/**/*.test.ts"
        - "**/*.test.ts"
        - "**/*.spec.ts"
      conventions:
        runner: "npm test or npx jest"
        e2e: "Playwright or Cypress"

    frontend:
      typical_implementations:
        - React Server Components + Client Components
        - Next.js App Router (layouts, pages, loading, error boundaries)
        - Tailwind CSS / CSS Modules / styled-components
        - Shadcn/ui / Radix / Headless UI
      expected_locations:
        - app/**/page.tsx
        - app/**/layout.tsx
        - app/components/
        - components/
        - lib/hooks/
        - app/**/loading.tsx
        - app/**/error.tsx
      behavioral_files:
        - "app/**/page.tsx"
        - "app/**/layout.tsx"
        - "components/**/*.tsx"
        - "lib/hooks/*.ts"
      conventions:
        routing: "file-based routing via app/ directory structure"
        components: "React function components with TypeScript"
        state: "useState, useContext, Zustand, or Jotai for client state"

    deployment:
      typical_implementations:
        - Vercel (default for Next.js)
        - Docker
        - AWS Amplify
        - Netlify
      expected_locations:
        - vercel.json
        - next.config.js (output setting)
        - Dockerfile
        - .github/workflows/
      behavioral_files:
        - vercel.json
        - next.config.js
        - Dockerfile
        - ".github/workflows/*.yml"
      conventions:
        build: "next build"
        output: "standalone, export, or default"

