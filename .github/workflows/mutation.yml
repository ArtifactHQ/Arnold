name: Mutation Testing

on:
  schedule:
    - cron: '0 4 * * 1-5'  # Weekday nights at 4am UTC
  workflow_dispatch:         # Manual trigger

jobs:
  mutation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ruby-4.0.0
          bundler-cache: true

      - name: Configure git identity
        run: |
          git config --global user.email "ci@arnold-pipeline.test"
          git config --global user.name "CI"

      - name: Prepare database
        env:
          RAILS_ENV: test
        run: bin/rails db:test:prepare

      - name: Run incremental mutation testing
        env:
          RAILS_ENV: test
        run: bundle exec mutant run --use minitest --since origin/master
